# 飞书推送：早晚固定简报 + 重大变化即时加推
feishu:
  # 2026-08-06 用户要求停止项目飞书推送
  enabled: false
  chat_id: "oc_381bea46653394d135daf14739524904"
  # 外部群必须用 bot（团宝）
  as: bot
  page_url: "https://minmengxhw-cpu.github.io/typhoon-impact-system/"

# 固定排期（本机 launchd 触发；与脚本 --slot 对应）
schedule:
  morning:
    hour: 8
    minute: 30
    label_zh: 早报
  evening:
    hour: 20
    minute: 30
    label_zh: 晚报

# 何为「重大变化」（会在早晚之外额外加推，标题带【升级】/【变化】）
major_change:
  level_change: true
  focus_storm_change: true
  p_main_delta: 0.12
  now_dist_drop_km: 400
  dca_threshold_km: [800, 400, 200]
  dca_lead_enter_hours: 120
  notify_on_first_run: false
